name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# read only, release job gets write. actions pinned to commits
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python build.py build_exe --build-exe dist/L-Recall

      - name: Package
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          Compress-Archive -Path dist/L-Recall/* -DestinationPath "L-Recall-$name-win64.zip"
          (Get-FileHash "L-Recall-$name-win64.zip" -Algorithm SHA256).Hash | Out-File -Encoding ascii "L-Recall-$name-win64.zip.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: L-Recall-win64
          path: L-Recall-*-win64.zip*

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: L-Recall-win64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # notes are the tag message minus its first line. empty or lightweight tag, github writes them
        run: |
          sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          { gh api "repos/$GH_REPO/git/tags/$sha" --jq .message 2>/dev/null || true; } | tail -n +2 > notes.md
          if grep -q '[^[:space:]]' notes.md; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$TAG" dist/L-Recall-*-win64.zip dist/L-Recall-*-win64.zip.sha256 --title "L-Recall $TAG" "${notes[@]}"
